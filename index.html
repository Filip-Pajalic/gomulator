<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gomulator Embed Example</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #1d2636;
      padding: 24px;
      box-sizing: border-box;
    }

    .embed-example {
      width: min(100%, 900px);
      margin: 0 auto;
    }

    .gomulator-frame {
      width: 100%;
      min-height: 980px;
      border: 0;
      display: block;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .gomulator-frame {
        min-height: 1180px;
      }
    }
  </style>
</head>
<body>
  <main class="embed-example">
    <iframe
      class="gomulator-frame"
      src="./emulator-iframe.html"
      title="Gomulator Game Boy Emulator"
      allow="fullscreen"
    ></iframe>
  </main>
</body>
</html>
