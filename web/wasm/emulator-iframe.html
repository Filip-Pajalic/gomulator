<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gomulator Frame</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: #000 !important;
    }
  </style>
</head>
<body>
  <script src="./wasm_exec.js"></script>
  <script>
    (function () {
      const go = new Go();
      let wasmReady = false;
      let pendingRom = null;

      async function instantiateWasm() {
        if (WebAssembly.instantiateStreaming) {
          try {
            return await WebAssembly.instantiateStreaming(fetch("./gomulator.wasm"), go.importObject);
          } catch (error) {
            console.warn("instantiateStreaming failed; retrying with arrayBuffer", error);
          }
        }

        const response = await fetch("./gomulator.wasm");
        const bytes = await response.arrayBuffer();
        return WebAssembly.instantiate(bytes, go.importObject);
      }

      function startRomLoad(buffer) {
        if (!wasmReady || typeof window.startEmulatorWithROM !== "function") {
          pendingRom = buffer;
          return;
        }

        window.startEmulatorWithROM(new Uint8Array(buffer), "auto");
      }

      window.startRomLoad = startRomLoad;

      instantiateWasm()
        .then((result) => {
          wasmReady = true;
          go.run(result.instance);
          if (pendingRom) {
            const rom = pendingRom;
            pendingRom = null;
            startRomLoad(rom);
          }
        })
        .catch((error) => {
          console.error("Failed to load emulator:", error);
        });
    })();
  </script>
</body>
</html>
