<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gomulator Iframe</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: #000 !important;
    }
  </style>
</head>
<body>
  <script src="./wasm_exec.js"></script>
  <script>
    const GOMULATOR_WASM_BASE64 = "";
  </script>
  <script>
    (function () {
      const go = new Go();
      let wasmReady = false;
      let pendingRom = null;

      function decodeBase64Bytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      async function instantiateWasm() {
        if (GOMULATOR_WASM_BASE64) {
          return WebAssembly.instantiate(decodeBase64Bytes(GOMULATOR_WASM_BASE64), go.importObject);
        }

        if (window.location.protocol === "file:") {
          throw new Error("Open the generated build/wasm/index.html from `make wasm`, or serve this directory over HTTP.");
        }

        if (WebAssembly.instantiateStreaming) {
          try {
            return await WebAssembly.instantiateStreaming(fetch("./gomulator.wasm"), go.importObject);
          } catch (error) {
            console.warn("instantiateStreaming failed; retrying with arrayBuffer", error);
          }
        }

        const response = await fetch("./gomulator.wasm");
        const bytes = await response.arrayBuffer();
        return WebAssembly.instantiate(bytes, go.importObject);
      }

      function startRom(buffer) {
        if (!wasmReady || typeof window.startEmulatorWithROM !== "function") {
          pendingRom = buffer;
          return;
        }

        window.startEmulatorWithROM(new Uint8Array(buffer), "auto");
      }

      function sendInput(button, pressed) {
        if (typeof window.emuInput === "function") {
          window.emuInput(button, pressed);
        } else if (pressed && typeof window.onButtonPress === "function") {
          window.onButtonPress(button);
        } else if (!pressed && typeof window.onButtonRelease === "function") {
          window.onButtonRelease(button);
        }
      }

      window.startRomLoad = (buffer) => {
        startRom(buffer);
      };

      window.addEventListener("message", (event) => {
        const message = event.data;
        if (!message || message.type !== "emu-input") return;
        sendInput(message.button, !!message.pressed);
      });

      instantiateWasm()
        .then((result) => {
          go.run(result.instance);
          wasmReady = true;
          if (pendingRom) {
            const rom = pendingRom;
            pendingRom = null;
            window.setTimeout(() => startRom(rom), 0);
          }
        })
        .catch((error) => {
          console.error("Failed to load emulator:", error);
        });
    })();
  </script>
</body>
</html>
