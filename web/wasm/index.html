<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gomulator Embed Example</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #1d2636;
      padding: 24px;
      box-sizing: border-box;
    }

    .emulator-container {
      max-width: 800px;
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.7);
      margin: 0 auto;
      text-align: center;
      padding: 0;
      border-radius: 8px;
      background-color: #333;
      padding-bottom: 2rem;
    }

    .rom-upload {
      margin: 0;
      padding: 0;
      border-radius: 8px;
      background-color: #333;
    }

    .load-interface {
      padding: 0 1rem;
      padding-top: 0.5rem;
      margin-bottom: 1rem;
      display: block;
    }

    .rom-status-display {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #4caf50;
      background-color: #222;
      border: 2px solid #4caf50;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.9rem;
      font-family: "Press Start 2P", monospace;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
      transition: box-shadow 0.1s ease;
      box-sizing: border-box;
    }

    .rom-status-display:hover {
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.7);
    }

    .load-trigger {
      background-color: #45a049;
      color: white;
      padding: 0.3rem 0.8rem;
      border-radius: 3px;
      font-family: sans-serif;
      font-size: 0.8rem;
      font-weight: bold;
      user-select: none;
      touch-action: none;
      cursor: pointer;
    }

    #statusText {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      margin-right: 10px;
      flex-grow: 1;
    }

    #romInput {
      display: none;
    }

    #emulatorBox {
      width: 640px;
      max-width: calc(100% - 40px);
      height: 576px;
      margin: 0 auto;
      border: 0;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
    }

    #emulatorFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    .info-box {
      margin-top: 10px;
      max-width: 800px;
      color: #fff;
    }

    .controls-layout {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 20px;
      box-sizing: border-box;
      margin-top: 20px;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 8px;
      width: 150px;
      height: 150px;
      touch-action: none;
    }

    .dpad .arrow,
    .round-button,
    .pill-button,
    .buttons,
    .center-buttons,
    .rom-status-display {
      touch-action: none;
      -ms-touch-action: none;
      cursor: pointer;
    }

    .dpad .arrow,
    .dpad .center {
      background: #666;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-size: 1.2rem;
      user-select: none;
    }

    .dpad .arrow.up {
      grid-column: 2;
      grid-row: 1;
    }

    .dpad .arrow.down {
      grid-column: 2;
      grid-row: 3;
    }

    .dpad .arrow.left {
      grid-column: 1;
      grid-row: 2;
    }

    .dpad .arrow.right {
      grid-column: 3;
      grid-row: 2;
    }

    .dpad .center {
      grid-column: 2;
      grid-row: 2;
      background: #777;
    }

    .dpad .arrow:active {
      background: #b37777;
    }

    .dpad .arrow.pressed,
    .round-button.pressed,
    .pill-button.pressed,
    .load-trigger.pressed {
      background: #b37777;
      transform: scale(0.98);
    }

    .buttons {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 24px;
      justify-content: center;
    }

    .round-button {
      width: 70px;
      height: 70px;
      background: #666;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.5rem;
      user-select: none;
    }

    .round-button:active {
      background: #b37777;
    }

    .center-buttons {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .pill-button {
      background: #666;
      color: #fff;
      border-radius: 20px;
      padding: 0.3rem 1.2rem;
      font-size: 0.9rem;
      user-select: none;
    }

    .pill-button:active {
      background: #b37777;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      #emulatorBox {
        max-width: calc(100% - 24px);
        max-width: 95vw;
      }
    }

    @media (max-width: 480px) {
      .controls-layout {
        flex-direction: column;
        justify-content: center;
        gap: 25px;
      }
    }

  </style>
</head>
<body>
  <div class="emulator-container">
    <div class="rom-upload">
      <div class="load-interface">
        <input type="file" id="romInput" accept=".gb,.gbc">

        <div id="romStatusDisplay" class="rom-status-display">
          <span id="statusText">Select a ROM to begin emulation</span>
          <span id="loadTrigger" class="load-trigger">Load</span>
        </div>
      </div>
    </div>

    <div id="emulatorBox">
      <iframe
        id="emulatorFrame"
        src="./emulator-iframe.html"
        title="Gomulator Game Boy Emulator"
        scrolling="no"
      ></iframe>
    </div>

    <div class="info-box">
      <div class="controls-layout">
        <div class="dpad">
          <div class="arrow up">↑</div>
          <div class="arrow left">←</div>
          <div class="center"></div>
          <div class="arrow right">→</div>
          <div class="arrow down">↓</div>
        </div>

        <div class="buttons">
          <div class="round-button b">X</div>
          <div class="round-button a">Z</div>
        </div>
      </div>

      <div class="center-buttons">
        <div class="pill-button select">Tab</div>
        <div class="pill-button start">Enter</div>
      </div>
    </div>
  </div>

  <script>
    const romInput = document.getElementById("romInput");
    const statusBarEl = document.getElementById("romStatusDisplay");
    const statusTextEl = document.getElementById("statusText");
    const loadTriggerEl = document.getElementById("loadTrigger");
    const iframe = document.getElementById("emulatorFrame");
    const emulatorBox = document.getElementById("emulatorBox");
    const emulatorContainer = document.querySelector(".emulator-container");
    const GB_SCREEN_WIDTH = 160;
    const GB_SCREEN_HEIGHT = 144;
    const MAX_EMULATOR_WIDTH = 700;
    let isRomLoaded = false;

    const pressed = {
      up: false,
      down: false,
      left: false,
      right: false,
      a: false,
      b: false,
      start: false,
      select: false,
    };

    const keyMap = {
      ArrowUp: "up",
      ArrowDown: "down",
      ArrowLeft: "left",
      ArrowRight: "right",
      KeyZ: "a",
      KeyX: "b",
      Enter: "start",
      Tab: "select",
      ShiftLeft: "select",
      ShiftRight: "select",
    };

    const selectorMap = {
      up: [".dpad .arrow.up"],
      down: [".dpad .arrow.down"],
      left: [".dpad .arrow.left"],
      right: [".dpad .arrow.right"],
      a: [".round-button.a"],
      b: [".round-button.b"],
      start: [".pill-button.start"],
      select: [".pill-button.select"],
    };

    const buttonSelectors = {
      ".dpad .arrow.up": "up",
      ".dpad .arrow.down": "down",
      ".dpad .arrow.left": "left",
      ".dpad .arrow.right": "right",
      ".round-button.a": "a",
      ".round-button.b": "b",
      ".pill-button.start": "start",
      ".pill-button.select": "select",
    };

    function setStatus(text) {
      if (statusTextEl) statusTextEl.textContent = text;
    }

    function parseRomMetadata(buffer) {
      const bytes = new Uint8Array(buffer);
      const titleBytes = bytes.slice(0x0134, 0x0144);
      const zeroIndex = titleBytes.indexOf(0);
      const visibleTitleBytes = titleBytes.slice(0, zeroIndex === -1 ? titleBytes.length : zeroIndex);
      const title = Array.from(visibleTitleBytes)
        .map((value) => (value >= 32 && value <= 126 ? String.fromCharCode(value) : ""))
        .join("")
        .trim();
      const cgbFlag = bytes[0x0143] || 0;
      let mode = "DMG";

      if (cgbFlag === 0xC0) {
        mode = "GBC-only";
      } else if (cgbFlag === 0x80) {
        mode = "GBC-compatible, running DMG mode";
      }

      return { title, cgbFlag, mode };
    }

    function formatLoadedStatus(fileName, metadata) {
      const romName = metadata.title ? `${fileName} (${metadata.title})` : fileName;
      return `Loaded: ${romName} - ${metadata.mode}`;
    }

    function resizeEmulatorBox() {
      if (!emulatorBox || !emulatorContainer) return;

      const containerWidth = emulatorContainer.clientWidth;
      const sideInset = window.matchMedia("(max-width: 600px)").matches ? 24 : 40;
      const availableWidth = Math.min(MAX_EMULATOR_WIDTH, Math.max(0, containerWidth - sideInset));
      let width = availableWidth;

      if (availableWidth >= GB_SCREEN_WIDTH) {
        const scale = Math.max(1, Math.floor(availableWidth / GB_SCREEN_WIDTH));
        width = scale * GB_SCREEN_WIDTH;
      }

      emulatorBox.style.width = `${width}px`;
      emulatorBox.style.height = `${Math.round((width * GB_SCREEN_HEIGHT) / GB_SCREEN_WIDTH)}px`;
    }

    function sendRomToEmulator(buffer, fileName, metadata) {
      const tryLoad = (attempt = 0) => {
        if (iframe?.contentWindow?.startRomLoad) {
          iframe.contentWindow.startRomLoad(buffer, fileName);
          setStatus(formatLoadedStatus(fileName, metadata));
          statusBarEl?.classList.add("loaded");
          if (loadTriggerEl) loadTriggerEl.textContent = "LOAD NEW";
          isRomLoaded = true;
        } else if (attempt < 20) {
          window.setTimeout(() => tryLoad(attempt + 1), 200);
        } else {
          setStatus("Emulator failed to initialize in iframe.");
        }
      };

      tryLoad();
    }

    function handleFileSelect(file) {
      if (!file) return;
      setStatus(`Loading: ${file.name}`);

      const reader = new FileReader();
      reader.onload = (event) => {
        const buffer = event.target?.result;
        if (!buffer) {
          setStatus("Failed to read the file.");
          return;
        }
        const metadata = parseRomMetadata(buffer);

        if (isRomLoaded && iframe) {
          setStatus("Reloading emulator for new ROM...");
          iframe.onload = () => {
            sendRomToEmulator(buffer, file.name, metadata);
            iframe.onload = null;
          };
          const currentSrc = iframe.src.split("?")[0];
          iframe.src = `${currentSrc}?reload=${Date.now()}`;
        } else {
          sendRomToEmulator(buffer, file.name, metadata);
        }
      };
      reader.onerror = () => setStatus("Failed to read the file.");
      reader.readAsArrayBuffer(file);
    }

    function setVisual(button, isPressed) {
      const selectors = selectorMap[button] || [];
      selectors.forEach((selector) => {
        document.querySelectorAll(selector).forEach((element) => {
          element.classList.toggle("pressed", !!isPressed);
        });
      });
    }

    function sendInput(button, pressedState) {
      if (!iframe?.contentWindow) return;
      const target = iframe.contentWindow;

      try {
        if (typeof target.emuInput === "function") {
          target.emuInput(button, pressedState);
          return;
        }
      } catch {
        // Cross-origin embeds cannot directly access iframe functions.
      }

      target.postMessage({ type: "emu-input", button, pressed: pressedState }, "*");
    }

    window.gomulatorDebugState = () => {
      if (!iframe?.contentWindow) return null;

      try {
        const state = iframe.contentWindow.gomulatorDebugState?.() || null;
        if (state) console.table(state);
        return state;
      } catch (error) {
        console.warn("Unable to read emulator debug state", error);
        return null;
      }
    };

    statusBarEl?.addEventListener("click", () => {
      romInput?.click();
    });

    romInput?.addEventListener("change", (event) => {
      const file = event.target.files && event.target.files[0];
      if (file) handleFileSelect(file);
    });

    document.addEventListener("keydown", (event) => {
      const button = keyMap[event.code];
      if (!button) return;
      if (!pressed[button]) {
        pressed[button] = true;
        sendInput(button, true);
        setVisual(button, true);
      }
      event.preventDefault();
    });

    document.addEventListener("keyup", (event) => {
      const button = keyMap[event.code];
      if (!button) return;
      if (pressed[button]) {
        pressed[button] = false;
        sendInput(button, false);
        setVisual(button, false);
      }
      event.preventDefault();
    });

    Object.entries(buttonSelectors).forEach(([selector, button]) => {
      document.querySelectorAll(selector).forEach((element) => {
        const start = (event) => {
          if (event.cancelable) event.preventDefault();
          if (!pressed[button]) {
            pressed[button] = true;
            sendInput(button, true);
          }
          element.classList.add("pressed");
        };

        const end = (event) => {
          if (event && event.cancelable) event.preventDefault();
          if (pressed[button]) {
            pressed[button] = false;
            sendInput(button, false);
          }
          element.classList.remove("pressed");
        };

        element.addEventListener("touchstart", start, { passive: false });
        element.addEventListener("touchend", end, { passive: false });
        element.addEventListener("touchcancel", end, { passive: false });

        if (window.PointerEvent) {
          element.addEventListener("pointerdown", start);
          element.addEventListener("pointerup", end);
          element.addEventListener("pointercancel", end);
          element.addEventListener("pointerleave", end);
        } else {
          element.addEventListener("mousedown", start);
          element.addEventListener("mouseup", end);
          element.addEventListener("mouseleave", end);
        }
      });
    });

    resizeEmulatorBox();
    window.addEventListener("resize", resizeEmulatorBox);
    window.addEventListener("beforeunload", () => {
      if (typeof iframe?.contentWindow?.flushSave === "function") {
        iframe.contentWindow.flushSave();
      }
    });
    if (window.ResizeObserver && emulatorContainer) {
      new ResizeObserver(resizeEmulatorBox).observe(emulatorContainer);
    }
  </script>
</body>
</html>
