<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gomulator Embed Example</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #1d2636;
      box-sizing: border-box;
    }

    .embed-example {
      width: min(100%, 900px);
      margin: 0 auto;
    }

    .gomulator-frame {
      width: 100%;
      height: 1120px;
      border: 0;
      display: block;
      overflow: hidden;
    }

    @media (max-width: 520px) {
      .gomulator-frame {
        height: 1250px;
      }
    }
  </style>
</head>
<body>
  <main class="embed-example">
    <iframe
      class="gomulator-frame"
      src="./emulator-iframe.html"
      title="Gomulator Game Boy Emulator"
      allow="fullscreen"
      scrolling="no"
    ></iframe>
  </main>
  <script>
    const emulatorFrame = document.querySelector(".gomulator-frame");

    window.addEventListener("message", (event) => {
      if (event.data?.type !== "gomulator-resize") return;
      if (!Number.isFinite(event.data.height)) return;
      emulatorFrame.style.height = `${Math.ceil(event.data.height)}px`;
    });
  </script>
</body>
</html>
