name: Build Gomulator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build Windows executable
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force build/native | Out-Null
        go build -o build/native/gomulator-windows-x64.exe ./cmd

    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: gomulator-windows-x64
        path: build/native/gomulator-windows-x64.exe
        retention-days: 30

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install Linux native dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libc6-dev \
          libgl1-mesa-dev \
          libx11-dev \
          libxcursor-dev \
          libxi-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxxf86vm-dev \
          libasound2-dev \
          pkg-config

    - name: Build Linux ARM64 executable
      run: |
        mkdir -p build/native
        go build -o build/native/gomulator-linux-arm64 ./cmd
        chmod +x build/native/gomulator-linux-arm64

    - name: Upload Linux ARM64 executable
      uses: actions/upload-artifact@v4
      with:
        name: gomulator-linux-arm64
        path: build/native/gomulator-linux-arm64
        retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build macOS executable
      run: |
        mkdir -p build/native
        go build -o build/native/gomulator-macos ./cmd
        chmod +x build/native/gomulator-macos

    - name: Upload macOS executable
      uses: actions/upload-artifact@v4
      with:
        name: gomulator-macos
        path: build/native/gomulator-macos
        retention-days: 30

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build WASM package
      run: |
        make wasm

    - name: Upload WASM binary
      uses: actions/upload-artifact@v4
      with:
        name: gomulator-wasm-binary
        path: build/wasm/gomulator.wasm
        retention-days: 30

    - name: Upload WASM package
      uses: actions/upload-artifact@v4
      with:
        name: gomulator-wasm-package
        path: build/artifacts/gomulator-wasm.zip
        retention-days: 30

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux-arm64, build-macos, build-wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
        title="Gomulator ${GITHUB_SHA::7}"
        mkdir -p release-assets
        find release-artifacts -type f -exec cp {} release-assets/ \;
        ls -la release-assets
        gh release create "$tag" release-assets/* \
          --target "$GITHUB_SHA" \
          --title "$title" \
          --notes "Automated Gomulator release for commit ${GITHUB_SHA}."

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux-arm64, build-macos, build-wasm]

    steps:
    - name: Build Summary
      run: |
        echo "✅ Windows x64 build completed"
        echo "✅ Linux ARM64 build completed"
        echo "✅ macOS build completed"
        echo "✅ WASM binary and package completed"
        echo "Release publishing runs only on push to main."
