name: Test Suite

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-roms:
    name: GB Test ROMs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GB_TEST_ROMS: /tmp/gb-test-roms
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Clone GB Test ROMs
      run: |
        git clone https://github.com/retrio/gb-test-roms.git "$GB_TEST_ROMS"
        echo "✅ Test ROMs cloned successfully"
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install Linux native dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libc6-dev \
          libgl1-mesa-dev \
          libx11-dev \
          libxcursor-dev \
          libxi-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxxf86vm-dev \
          libasound2-dev \
          pkg-config \
          xvfb
    
    - name: Build emulator
      run: |
        go build -tags debug -o gomulator ./cmd
        chmod +x gomulator
    
    - name: Test CPU Instructions (cpu_instrs.gb)
      id: cpu_instrs
      timeout-minutes: 12
      run: |
        echo "::group::CPU Instructions Test"
        set +e
        timeout 600s xvfb-run -a ./gomulator "$GB_TEST_ROMS/cpu_instrs/cpu_instrs.gb" 2>&1 | tee test_output.txt
        status=${PIPESTATUS[0]}
        set -e
        if [ "$status" -ne 0 ]; then
          echo "❌ CPU Instructions aggregate exited with status $status"
          echo "::error::CPU Instructions aggregate exited with status $status"
          echo "passed=false" >> "$GITHUB_OUTPUT"
        elif grep -qi "TEST PASSED" test_output.txt; then
          echo "✅ CPU Instructions PASSED"
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "❌ CPU Instructions aggregate did not report pass"
          echo "::error::CPU Instructions aggregate did not report pass"
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi
        echo "::endgroup::"
    
    - name: Test Individual CPU Instructions
      if: always()
      id: individual_cpu_instrs
      run: |
        echo "::group::Individual CPU Instruction Tests"
        FAILED_TESTS=""
        EXIT_CODE=0
        
        for rom in "$GB_TEST_ROMS"/cpu_instrs/individual/*.gb; do
          rom_name=$(basename "$rom")
          echo "::group::Testing $rom_name"
          
          set +e
          timeout 60s xvfb-run -a ./gomulator "$rom" 2>&1 | tee test_output_individual.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ] && grep -qi "TEST PASSED" test_output_individual.txt; then
            echo "✅ $rom_name PASSED"
          else
            echo "❌ $rom_name FAILED (exit $status)"
            cat test_output_individual.txt
            FAILED_TESTS="$FAILED_TESTS\n  - $rom_name"
            EXIT_CODE=1
          fi
          
          echo "::endgroup::"
        done
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "::error::Failed CPU instruction tests:$FAILED_TESTS"
          echo "passed=false" >> "$GITHUB_OUTPUT"
        else
          echo "passed=true" >> "$GITHUB_OUTPUT"
        fi
        echo "::endgroup::"
    
    - name: Test Instruction Timing (instr_timing.gb)
      if: always()
      id: instr_timing
      timeout-minutes: 2
      run: |
        echo "::group::Instruction Timing Test"
        set +e
        timeout 60s xvfb-run -a ./gomulator "$GB_TEST_ROMS/instr_timing/instr_timing.gb" 2>&1 | tee test_timing.txt
        status=${PIPESTATUS[0]}
        set -e
        if [ "$status" -eq 0 ] && grep -qi "TEST PASSED" test_timing.txt; then
          echo "✅ Instruction Timing PASSED"
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "❌ Instruction Timing FAILED (exit $status)"
          cat test_timing.txt
          echo "::error::Instruction Timing failed"
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi
        echo "::endgroup::"
    
    - name: Test Summary
      if: always()
      run: |
        failed=0
        if [ "${{ steps.cpu_instrs.outputs.passed }}" != "true" ]; then
          echo "::error::CPU Instructions aggregate failed"
          failed=1
        fi
        if [ "${{ steps.individual_cpu_instrs.outputs.passed }}" != "true" ]; then
          echo "::error::Individual CPU instruction ROMs failed"
          failed=1
        fi
        if [ "${{ steps.instr_timing.outputs.passed }}" != "true" ]; then
          echo "::error::Instruction timing ROM failed"
          failed=1
        fi
        if [ "$failed" -ne 0 ]; then
          exit 1
        fi
        echo "::notice::✅ All GB test ROMs passed!"
        echo "Tests completed:"
        echo "  ✅ CPU Instructions aggregate (cpu_instrs.gb)"
        echo "  ✅ Individual CPU instruction ROMs"
        echo "  ✅ Instruction Timing (instr_timing.gb)"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install Linux native dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libc6-dev \
          libgl1-mesa-dev \
          libx11-dev \
          libxcursor-dev \
          libxi-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxxf86vm-dev \
          libasound2-dev \
          pkg-config \
          xvfb
    
    - name: Run unit tests
      run: |
        xvfb-run -a go test ./... -v

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test-roms, unit-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install Linux native dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libc6-dev \
          libgl1-mesa-dev \
          libx11-dev \
          libxcursor-dev \
          libxi-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxxf86vm-dev \
          libasound2-dev \
          pkg-config
    
    - name: Build native
      run: |
        go build -o gomulator ./cmd
    
    - name: Build WASM
      run: |
        GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o gomulator.wasm ./cmd
    
    - name: All checks passed
      run: |
        echo "✅ All tests and builds successful!"
